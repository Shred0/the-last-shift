; Home time jumps per act, same order as AreaMaps: a full jump is a contact with response Jump or RewindAndJump;
; a graze (voluntary Resume with the figure within the entity's GrazeRadius) is GrazeJumpFraction of it.
; One year = 365.25 days = 31557600 s. Act 1: 10 minutes, 4 %; act 2: 6 months, 10 %; act 3: 40 years, 12 %; act 4: 300 years, 8 %.
.ActTuning=(JumpHomeSeconds=600.0,JumpBatteryDrop=0.04)
.ActTuning=(JumpHomeSeconds=15778800.0,JumpBatteryDrop=0.10)
.ActTuning=(JumpHomeSeconds=1262304000.0,JumpBatteryDrop=0.12)
.ActTuning=(JumpHomeSeconds=9467280000.0,JumpBatteryDrop=0.08)
GrazeJumpFraction=0.25
; Maps outside AreaMaps (TestLidar, AreaTest).
TestActTuning=(JumpHomeSeconds=600.0,JumpBatteryDrop=0.04)
TravelHoldSeconds=4.0
; Every colour a scan can show, one owner (Brief 5b). Scan = captured points, ReadyCue = scan-ready ring, Residue = residue
; points and collect ring, Entity = figure and trail, Interactable = terminals and closed doors.
