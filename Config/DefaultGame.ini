; The prologue's two hand-built maps (Brief 11), outside the run: "New game" goes from the text scene to the home (print
; room, one corridor to the hangar, the monitor room with the hologram off its side, the hangar and the ship; Brief 14),
; the flight's travel screen, the arrival hangar, then area 1. At home the hangar's terminal works only once the
; Hologram lines (the briefing) are typed out; in the hangar the entry door closes behind the player in
; HomeDoorCloseSeconds, then the hangar's hatch opens in HomeHatchOpenSeconds, then the ship's hatch in
; ShipHatchOpenSeconds (Normal time, still while Stopped and behind the pause menu); only then can the ship be boarded.
; bPrologueMaps=False goes from the text scene straight to area 1. The home AI's lines there are DT_Prologue's rows
; (<Group>_<order>). The arrival's hatch closes in HatchCloseSeconds of Normal time once the player has left the ship.
; Then the Hatch lines, the Door lines, ExitDoorDelaySeconds of Normal time, and the exit door opens.
; The flashlight: off and unavailable at home unless bFlashlightAtHome; in the arrival it works as in the areas and is
; on at the start only with bFlashlightOnAtArrival. The four areas and TestLidar keep the pawn's own default.
; The hologram: an octahedron Size cm across of Points points (cubes PointSize cm), EdgeShare of them on its edges,
; in ScanColors.Scan. It turns once in TurnSeconds; each point drifts along its face up to DriftDistance cm and back in
; about DriftSeconds (each its own period, within DriftPeriodSpread of it, and phase). The route, in ScanColors.Entity:
; RouteNode1..4 in the octahedron's frame as fractions of its half-diagonal, nodes RouteNodeSize cm, lines RouteLineWidth
; cm, drawn by the share of the Hologram lines typed. The beams: one from each of the base's BeamRods rods (BeamRodRadius
; cm from its pivot, tips BeamRodTop cm up, the first at BeamRodAngle), the axis on the hologram's centre, the spread
; BeamSpreadShare of the angle of the smallest cone that holds the whole turning hologram grown by BeamMargin cm,
; BeamLength of the way to the hologram's far side (0.6325: they end at the hologram's centre, with BeamMargin 10),
; BeamLevel of the hologram's colour at the tip times (1 - u)^BeamFadePower at a share u of the length (nothing at the
; end), flickering by BeamFlicker at about BeamFlickerHz.
