; closed and straight, the travel starting ExitTriggerDepthM (m) in from its mouth, then ExitRunLengthM (m) on past it,
; open on the dark at its end. bTwinAIRoom puts the twin AI's room right before it, holding the twin AI's terminal.
; AreaRecipes and AreaSeeds use "." (append even when equal): "+" would merge identical entries.
