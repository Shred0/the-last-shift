; Home time jumps per act, same order as AreaMaps: a full jump is a contact with response Jump or RewindAndJump;
; a graze (voluntary Resume with the figure within the entity's GrazeRadius) is GrazeJumpFraction of it.
; One year = 365.25 days = 31557600 s. Act 1: 10 minutes, 4 %; act 2: 6 months, 10 %; act 3: 40 years, 12 %; act 4: 300 years, 8 %.
.ActTuning=(JumpHomeSeconds=600.0,JumpBatteryDrop=0.04)
.ActTuning=(JumpHomeSeconds=15778800.0,JumpBatteryDrop=0.10)
.ActTuning=(JumpHomeSeconds=1262304000.0,JumpBatteryDrop=0.12)
.ActTuning=(JumpHomeSeconds=9467280000.0,JumpBatteryDrop=0.08)
GrazeJumpFraction=0.25
; Maps outside AreaMaps (TestLidar, AreaTest).
TestActTuning=(JumpHomeSeconds=600.0,JumpBatteryDrop=0.04)
TravelHoldSeconds=4.0
; The travel screen's progress bar after each real step of an area build (Brief 6b); the map's arrival is StdCore's
; TransitionMapLoadedProgress below and the bar is full when the area releases the player. Weights follow the measured
; time of each step into area 2.
TravelProgress=(RoutePlanned=0.3,GeometryBuilt=0.45,NavigationReady=0.9)
; Every colour a scan can show, one owner (Brief 5b). Scan = captured points, ReadyCue = scan-ready ring, Residue = residue
; points and collect ring, Entity = figure and trail, Interactable = terminals and closed doors.
ScanColors=(Scan=(R=0.4,G=0.85,B=1.0,A=1.0),ReadyCue=(R=1.0,G=1.0,B=1.0,A=0.9),Residue=(R=0.75,G=0.25,B=1.0,A=1.0),Entity=(R=1.0,G=0.16,B=0.05,A=1.0),Interactable=(R=0.1,G=1.0,B=0.3,A=1.0))
; Custom depth stencil value of terminal and door meshes = the lidar colour channel that shows them in
; ScanColors.Interactable (Brief 2l). 1 to 4.
InteractableScanChannel=1
; The home AI's messages and the endings (Brief 6), imported from Narrative/*.csv. The travel screen's label is the
; AreaEntry row of the destination act (none: no label).
AIMessagesTable=/Game/TheLastShift/Narrative/DT_AIMessages.DT_AIMessages
EndingsTable=/Game/TheLastShift/Narrative/DT_Endings.DT_Endings

; The game's own main menu: StdCore's main menu class extended in the Game zone (Continue, Select act, New game), in the
; game's map, with the game's title. MainMenuMap is the one setting both returns to the menu read (after the last area,
; and the pause menu's Main menu). No GameplayMap: a run starts in the first entry of AreaMaps (URunSubsystem).
[/Script/StdCore.StdProjectSettings]
MainMenuWidgetClass=/Script/TheLastShift.RunMainMenuWidget
MainMenuMap=/Game/TheLastShift/Maps/MainMenu.MainMenu
MainMenuTitle=NSLOCTEXT("TheLastShift", "MainMenuTitle", "The Last Shift")
; The travel screen (Brief 6b): a thin bar along the bottom edge with the real loading progress, and a marker on top of it
; that crosses the screen over the covered time (it stands for the walk; a placeholder rectangle until the walk cycle
; exists, then TransitionMarkerImage). Dim neutral grey, never the scan colour; to be tuned.
bTransitionProgressBar=True
TransitionProgressBarHeight=4.0
TransitionProgressBarColor=(R=0.22,G=0.22,B=0.22,A=1.0)
TransitionMapLoadedProgress=0.25
bTransitionMarker=True
TransitionMarkerSize=(X=10.0,Y=22.0)
TransitionMarkerColor=(R=0.22,G=0.22,B=0.22,A=1.0)
; Controls (Brief 5c). StdCore adds both contexts to the player and registers them for rebinding. IMC_Default keeps the
; pause key and Interact (StdCore's IA_Interact, the pawn's InteractAction); IMC_TestLidar holds the game's own actions
; and their default keys, at a higher priority so its keys win where StdCore's unused rows still map the same key.
; The array replaces StdCore's default list, so IMC_Default is named again.
!MappingContexts=ClearArray
+MappingContexts=(MappingContext="/StdCore/Input/IMC_Default.IMC_Default",Priority=0)
+MappingContexts=(MappingContext="/Game/TheLastShift/Input/IMC_TestLidar.IMC_TestLidar",Priority=1)
; The Controls tab: these eight rows, in this order (Player Mappable Key names set in IMC_TestLidar, Interact on
; StdCore's IA_Interact). The labels are short UI labels.
!KeyBindingRows=ClearArray
+KeyBindingRows=(MappingName="WalkForward",DisplayName=NSLOCTEXT("TheLastShift", "ControlsMoveForward", "Move forward"))
+KeyBindingRows=(MappingName="WalkBack",DisplayName=NSLOCTEXT("TheLastShift", "ControlsMoveBack", "Move back"))
+KeyBindingRows=(MappingName="WalkLeft",DisplayName=NSLOCTEXT("TheLastShift", "ControlsMoveLeft", "Move left"))
+KeyBindingRows=(MappingName="WalkRight",DisplayName=NSLOCTEXT("TheLastShift", "ControlsMoveRight", "Move right"))
+KeyBindingRows=(MappingName="StopTime",DisplayName=NSLOCTEXT("TheLastShift", "ControlsStopTime", "Stop time"))
+KeyBindingRows=(MappingName="Scan",DisplayName=NSLOCTEXT("TheLastShift", "ControlsScan", "Scan"))
+KeyBindingRows=(MappingName="Flashlight",DisplayName=NSLOCTEXT("TheLastShift", "ControlsFlashlight", "Flashlight"))
+KeyBindingRows=(MappingName="Interact",DisplayName=NSLOCTEXT("TheLastShift", "ControlsInteract", "Interact"))
; StdCore's own rows that do nothing in this game (its IA_Move and IA_Jump are not bound by the pawn).
!HiddenKeyMappings=ClearArray
+HiddenKeyMappings=MoveForward
+HiddenKeyMappings=MoveBackward
+HiddenKeyMappings=MoveLeft
+HiddenKeyMappings=MoveRight
+HiddenKeyMappings=Jump

