; The look of the surfaces (Brief 21), Normal time only: opaque materials, nothing emissive (an accent is paint, seen only
; where a light falls on it), so nothing of it shows while Stopped or in a scan's capture. Four families (floors and
; decks, wall and ceiling panels, structure, objects) keep their own tone, metal and roughness in their material instance
; (Art/Materials/MI_Surface_*); these values move them together, per structure. Home: Prologue_Home and the ship wherever
; it stands; the twin structure: every other map. Tint = the accent paint (curbs of walkways and halls, frames of doors and
; gates, terminals' bodies): home's is the hue of the scan's points, stored here as its own value; the twin's is yellow.
; AccentStrength = how much of the tint the paint keeps (faded below 1), AccentLevel = its brightness as a factor of the
