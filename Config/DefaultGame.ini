; surface (black, opaque, not emissive). The one owner of the reference; its folder is always cooked (below).
ScreenMaterial=/Game/TheLastShift/Art/Materials/MI_Surface_Screen.MI_Surface_Screen
; Scan points behind geometry (Brief 12): drawn at OccludedIntensity of their own intensity (0 = hidden, 1 = like the
; points in front, as if the geometry were not there). Below 1, after each scan starts every alive point is full for
; LinkSeconds, then hidden ones fade to OccludedIntensity over FadeSeconds; at 1 these have no visible effect.
ScanOcclusion=(OccludedIntensity=1.0,LinkSeconds=1.5,FadeSeconds=0.75)
; Neighbour lines between scan points (Brief 13): each point linked to at most Neighbours of its nearest points of the same
; scan and channel within MaxDistanceCm, and no two points whose surface normals differ by more than MaxNormalAngle (degrees).
; Lines are PixelWidth pixels wide, Intensity times as bright as their points, grow over ScanOcclusion.LinkSeconds and show
; only where nothing stands in front of them. MaxLinksPerScan caps one scan. Neighbours=0 switches them off.
; A line's ends are lifted off their surface, toward the scan, by LiftTexels capture texels at their depth from the scan,
; at most LiftMaxCm, so that far lines are not hidden by their own surface.
; Mode chooses how the links are found (Brief 23): Nearest, each point to its Neighbours nearest points (mutual nearest
; neighbours, at most MaxDistanceCm apart); Grid, each point to the next point to its right and below it on the capture's
; grid, at most GridMaxDistanceCm apart. Only the search differs: the lines are the same.
ScanLinks=(Neighbours=6,MaxDistanceCm=80.0,PixelWidth=1.5,Intensity=0.3,MaxNormalAngle=90.0,MaxLinksPerScan=65536,LiftTexels=0.5,LiftMaxCm=30.0,Mode=Nearest,GridMaxDistanceCm=80.0)
; Scan memory by density (Brief 25): when a scan's points appear, every point of an older scan that lies on a surface the
; new scan captured (inside its coverage, beyond its MinSampleDepth, facing the same way and within ToleranceCm of that
; surface plus the point's own sampling error) is removed where the new scan's sample spacing on that surface is at most
; Ratio times the older scan's; its lines go with it. What the new scan does not capture stays. Ratio 0 = off (scans
; covering the same surface add up), 2 = a scan from about the same distance or nearer replaces the older points, one from
; much farther leaves them, 100000 = the newest scan replaces whatever it captures.
ScanMemory=(Ratio=2.0,ToleranceCm=4.0)
